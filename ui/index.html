<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KataGomo Studio</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><header><div><span class="mark">K</span><strong>KataGomo Studio</strong><small>NEURAL GOMOKU WORKBENCH</small></div><span id="status" role="status">준비</span></header>
<main><section class="play">
<div class="toolbar"><label>룰 <select id="rule"><option value="freestyle">자유 오목</option><option value="standard">표준 오목</option><option value="renju">렌주</option><option value="caro">Caro</option></select></label><label>보드 <select id="size"><option value="15">15 × 15</option><option value="19">19 × 19</option></select></label><button id="new">새 대국</button><button id="undo">무르기</button><button id="save">SGF 저장</button></div>
<div class="boardframe"><canvas id="board" aria-label="오목 보드" tabindex="0"></canvas></div>
<div class="bottom"><span id="turn">흑 차례</span><label><input type="checkbox" id="auto"> 자동 AI 응수 (백)</label><label><input type="checkbox" id="heat" checked> 후보 표시</label><button id="best">최선수 착수</button></div>
</section><aside>
<section class="panel"><h2>엔진 분석</h2><div class="eval"><span>흑 <b id="wr">—</b></span><span>백</span></div><div class="bar"><div id="blackbar"></div></div><p id="root">모델을 지정하고 분석을 시작하세요.</p><div class="limits"><label>Visits<input type="number" id="visits" min="1" max="10000000" value="500"></label><label>Seconds<input type="number" id="seconds" min=".1" max="600" step=".1" value="10"></label></div><div class="buttons"><button id="analyze" class="primary">분석</button><button id="stop" disabled>중단</button></div><div id="candidates" class="candidates"></div><canvas id="chart" width="540" height="110" aria-label="흑 평가 그래프"></canvas></section>
<section class="panel"><h2>균형 오프닝 · 방어 탐색</h2><label>Balance bias (0 = 50%)<input id="balance-bias" type="number" min="-6000" max="6000" step="10" value="0"></label><div class="special-buttons"><button id="balance-one">균형 1수</button><button id="balance-two">균형 2수</button><button id="defend">방어 탐색</button></div><p id="special-summary" class="note">MCTS 기반 후보 조합 평가</p><div id="special-lines" class="candidates"></div><button id="apply-line" disabled>선택 수순 착수</button></section>
<section class="panel"><h2>룰별 신경망 프로필</h2><p id="profile-key"></p><label>엔진 실행 파일<div class="path"><input id="exe" placeholder="katago.exe"><button data-pick="exe">찾기</button></div></label><label>신경망 가중치<div class="path"><input id="model" placeholder="model.bin.gz"><button data-pick="model">찾기</button></div></label><label>분석 설정<div class="path"><input id="config" placeholder="analysis.cfg"><button data-pick="config">찾기</button></div></label><label>추가 룰 JSON<input id="extra" value="{}" placeholder="{}"></label><div class="buttons"><button id="profile-save">프로필 저장</button><button id="profile-remove">삭제</button></div><div class="buttons"><button id="profiles-export">프로필 내보내기</button><button id="profiles-import">프로필 불러오기</button></div><p class="note">15/19 및 룰마다 독립 등록. Caro는 Caro2024 엔진 필요. 모델을 다른 룰로 자동 대체하지 않습니다.</p></section>
<section class="panel"><h2>착수 기록</h2><div id="moves"></div></section>
</aside></main><footer>KataGomo upstream · MCTS / neural network · Local analysis only</footer></body></html>
